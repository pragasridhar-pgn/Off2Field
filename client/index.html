<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#16324f" />
    <meta name="description" content="OFF2FIELD — Offline-first field inspection platform" />
    <link rel="manifest" href="/manifest.json" />
    <title>OFF2FIELD — Field Inspection OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.hostname !== 'localhost' && !window.Capacitor?.isNativePlatform?.()) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
